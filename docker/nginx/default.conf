server {
    listen 80;
    server_name _;

    # Yii2 basic отдаёт приложение из web/, всё остальное вне docroot.
    root /app/web;
    index index.php;

    charset utf-8;
    client_max_body_size 10m;

    # Красивые URL Yii: несуществующие пути уходят на фронт-контроллер.
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Прямой доступ к любым другим .php запрещён — точка входа только одна.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}
