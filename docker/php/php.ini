memory_limit = 256M
max_execution_time = 60

; Загрузка обложек книг.
upload_max_filesize = 8M
post_max_size = 10M

date.timezone = UTC

; В dev-режиме ошибки видны в браузере и в логе контейнера.
display_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; Фактическим режимом управляет переменная окружения XDEBUG_MODE (см. docker-compose.yml):
; off — обычная работа, coverage — сбор покрытия PHPUnit, debug — пошаговая отладка.
; Она перекрывает эту настройку, но ini_get('xdebug.mode') её не отражает, поэтому
; дефолт задан здесь явно.
xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
