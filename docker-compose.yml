services:
  nginx:
    image: nginx:1.31-alpine
    ports:
      - "${HTTP_PORT:-8082}:80"
    volumes:
      - ./:/app:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    volumes:
      - ./:/app:cached
    environment:
      # off — обычная работа; для покрытия тестами переопределяется в `make test`.
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      DB_DSN: "mysql:host=mysql;port=3306;dbname=${DB_NAME:-book_catalogue}"
      DB_TEST_DSN: "mysql:host=mysql;port=3306;dbname=${DB_NAME:-book_catalogue}_test"
      DB_USERNAME: "${DB_USER:-catalogue}"
      DB_PASSWORD: "${DB_PASSWORD:-catalogue}"
      # Ключ-эмулятор smspilot: запросы принимаются, реальные SMS не уходят.
      SMSPILOT_API_KEY: "${SMSPILOT_API_KEY:-XXXXXXXXXXXXYYYYYYYYYYYYZZZZZZZZZZZZ}"
      COOKIE_VALIDATION_KEY: "${COOKIE_VALIDATION_KEY:-}"
      YII_ENV: "${YII_ENV:-dev}"
      YII_DEBUG: "${YII_DEBUG:-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-book_catalogue}"
      MYSQL_USER: "${DB_USER:-catalogue}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-catalogue}"
    volumes:
      - db-data:/var/lib/mysql
      # Создаёт тестовую базу при первой инициализации тома.
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # php и миграции стартуют только после того, как сервер реально принимает подключения.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db-data:
